name: Deploy to GCP VM

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/p_tonki1123/Office-Politics-Game
            git fetch origin
            git checkout dev
            git pull origin dev
            npm ci
            npm run build

            cd server
            npm ci
            pm2 restart office-politics-server
